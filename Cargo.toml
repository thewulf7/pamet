[package]
name = "pamet"
version = "0.1.0"
edition = "2021"
description = "Pamet memory store MVP: rule-based write policy + hybrid retrieval + outcome logging"

[lib]
name = "pamet"
path = "src/lib.rs"

[[bin]]
name = "pamet"
path = "src/bin/pamet.rs"

[[bin]]
name = "pamet-mcp"
path = "src/bin/pamet_mcp.rs"
required-features = ["mcp"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rmcp = { version = "0.1", features = ["transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
schemars = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[features]
mcp = ["rmcp", "tokio", "schemars", "anyhow"]
baseline-hindsight = ["reqwest"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "contract_remember"
path = "tests/contract/test_remember.rs"

[[test]]
name = "contract_recall"
path = "tests/contract/test_recall.rs"

[[test]]
name = "contract_outcome"
path = "tests/contract/test_outcome.rs"

[[test]]
name = "integration_write_policy"
path = "tests/integration/test_write_policy.rs"

[[test]]
name = "integration_recall"
path = "tests/integration/test_recall.rs"

[[test]]
name = "integration_outcome_logging"
path = "tests/integration/test_outcome_logging.rs"

[[test]]
name = "unit_write_policy_rules"
path = "tests/unit/test_write_policy_rules.rs"

[[test]]
name = "integration_tombstone"
path = "tests/integration/test_tombstone.rs"

[[test]]
name = "integration_rebuild"
path = "tests/integration/test_rebuild.rs"

[[test]]
name = "smoke"
path = "tests/smoke/test_smoke.rs"

[[test]]
name = "e2e_cli"
path = "tests/e2e/test_cli_e2e.rs"

[[test]]
name = "integration_consolidation"
path = "tests/integration/test_consolidation.rs"

[[test]]
name = "integration_eval_harness"
path = "tests/integration/test_eval_harness.rs"

[[test]]
name = "e2e_consolidation"
path = "tests/e2e/test_consolidation_e2e.rs"
